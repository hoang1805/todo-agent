[project]
name = "todo-agent"
version = "0.1.0"
description = "A local, skill-aware AI task-management agent built on Ollama, LangChain/LangGraph, MCP, and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langchain-mcp-adapters",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "nest-asyncio",
]

[dependency-groups]
dev = [
    "pytest",
]
